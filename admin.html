<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사율 CMS 관리자</title>
<style>
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f5f3;color:#202020}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
header{background:#0b0d0f;color:#fff;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font:22px Georgia;letter-spacing:5px}
main{padding:35px 0}.panel{background:#fff;border:1px solid #ddd;padding:24px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;box-sizing:border-box}textarea{min-height:120px}
button{padding:11px 16px;border:0;background:#b99a61;color:#fff;cursor:pointer;margin-right:6px}.secondary{background:#333}.danger{background:#a94442}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
.status{padding:12px;background:#eee;margin:10px 0}.ok{border-left:4px solid #20a36a}.err{border-left:4px solid #c94b4b}.warn{border-left:4px solid #d59b30}
.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap nav"><div class="logo">SA YUL CMS</div><button id="logout" class="secondary hidden">로그아웃</button></div></header>
<main class="wrap">
<div id="status" class="status">Supabase 연결 확인 중…</div>

<section id="loginPanel" class="panel hidden">
<h2>관리자 로그인</h2>
<input id="email" type="email" placeholder="관리자 이메일">
<input id="password" type="password" placeholder="비밀번호">
<button id="login">로그인</button>
</section>

<section id="cms" class="hidden">
<div class="grid">
<div class="panel"><h2>사건사례 등록</h2>
<input id="caseCategory" placeholder="분야 예: 형사 · 수사단계">
<input id="caseTitle" placeholder="제목">
<textarea id="caseSummary" placeholder="사건 개요/내용"></textarea>
<input id="caseResult" placeholder="결과">
<label><input id="casePublished" type="checkbox" checked> 홈페이지 공개</label><br>
<button id="addCase">등록</button>
</div>

<div class="panel"><h2>공지사항 등록</h2>
<input id="noticeTitle" placeholder="제목">
<textarea id="noticeContent" placeholder="내용"></textarea>
<label><input id="noticePublished" type="checkbox" checked> 홈페이지 공개</label><br>
<button id="addNotice">등록</button>
</div>
</div>

<div class="panel"><h2>상담신청</h2><div id="inquiries"></div></div>
<div class="panel"><h2>등록된 사건사례</h2><div id="cases"></div></div>
<div class="panel"><h2>등록된 공지사항</h2><div id="notices"></div></div>
</section>
</main>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import {getConfig} from "./js/config.js";
const cfg=getConfig(), status=document.getElementById("status"), loginPanel=document.getElementById("loginPanel"), cms=document.getElementById("cms"), logout=document.getElementById("logout");
if(!cfg.url||!cfg.key){status.className="status warn";status.textContent="js/config.js에 Supabase Project URL과 Publishable key를 입력하세요.";loginPanel.classList.remove("hidden");}
else{
 const sb=createClient(cfg.url,cfg.key);
 async function boot(){
   const {data:{session}}=await sb.auth.getSession();
   if(!session){loginPanel.classList.remove("hidden");status.textContent="관리자 로그인이 필요합니다.";return;}
   const {data:p,error}=await sb.from("profiles").select("is_admin,display_name").eq("id",session.user.id).single();
   if(error||!p?.is_admin){status.className="status err";status.textContent="관리자 권한이 없는 계정입니다.";return;}
   status.className="status ok";status.textContent=`관리자 인증 성공 · ${p.display_name||session.user.email}`;
   loginPanel.classList.add("hidden");cms.classList.remove("hidden");logout.classList.remove("hidden");loadAll();
 }
 document.getElementById("login").onclick=async()=>{
   status.className="status";status.textContent="로그인 중…";
   const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
   if(error){status.className="status err";status.textContent="로그인 실패: "+error.message;return;} boot();
 };
 logout.onclick=async()=>{await sb.auth.signOut();location.reload()};

 document.getElementById("addCase").onclick=async()=>{
   const {error}=await sb.from("cases").insert({category:caseCategory.value.trim(),title:caseTitle.value.trim(),summary:caseSummary.value.trim(),result:caseResult.value.trim(),published:casePublished.checked});
   status.className=error?"status err":"status ok";status.textContent=error?"사건사례 등록 실패: "+error.message:"사건사례 등록 성공";if(!error){caseCategory.value=caseTitle.value=caseSummary.value=caseResult.value="";loadCases();}
 };
 document.getElementById("addNotice").onclick=async()=>{
   const {error}=await sb.from("notices").insert({title:noticeTitle.value.trim(),content:noticeContent.value.trim(),published:noticePublished.checked});
   status.className=error?"status err":"status ok";status.textContent=error?"공지 등록 실패: "+error.message:"공지 등록 성공";if(!error){noticeTitle.value=noticeContent.value="";loadNotices();}
 };
 async function loadAll(){loadCases();loadNotices();loadInquiries();}
 async function loadCases(){const {data,error}=await sb.from("cases").select("*").order("created_at",{ascending:false});cases.innerHTML=error?error.message:(data?.length?`<table><tr><th>분야</th><th>제목</th><th>공개</th><th>작업</th></tr>${data.map(x=>`<tr><td>${h(x.category)}</td><td>${h(x.title)}</td><td>${x.published?"공개":"비공개"}</td><td><button class="danger" onclick="deleteCase('${x.id}')">삭제</button></td></tr>`).join("")}</table>`:"등록된 사건사례 없음");}
 async function loadNotices(){const {data,error}=await sb.from("notices").select("*").order("created_at",{ascending:false});notices.innerHTML=error?error.message:(data?.length?`<table><tr><th>제목</th><th>공개</th><th>작업</th></tr>${data.map(x=>`<tr><td>${h(x.title)}</td><td>${x.published?"공개":"비공개"}</td><td><button class="danger" onclick="deleteNotice('${x.id}')">삭제</button></td></tr>`).join("")}</table>`:"등록된 공지 없음");}
 async function loadInquiries(){const {data,error}=await sb.from("inquiries").select("*").order("created_at",{ascending:false});inquiries.innerHTML=error?error.message:(data?.length?`<table><tr><th>성명</th><th>연락처</th><th>내용</th><th>상태</th></tr>${data.map(x=>`<tr><td>${h(x.name)}</td><td>${h(x.phone)}</td><td>${h(x.message)}</td><td><select onchange="setStatus('${x.id}',this.value)"><option ${x.status==="new"?"selected":""} value="new">신규</option><option ${x.status==="contacted"?"selected":""} value="contacted">연락완료</option><option ${x.status==="done"?"selected":""} value="done">처리완료</option></select></td></tr>`).join("")}</table>`:"상담신청 없음");}
 window.deleteCase=async id=>{const {error}=await sb.from("cases").delete().eq("id",id);if(error)status.textContent=error.message;else loadCases()};
 window.deleteNotice=async id=>{const {error}=await sb.from("notices").delete().eq("id",id);if(error)status.textContent=error.message;else loadNotices()};
 window.setStatus=async(id,v)=>{const {error}=await sb.from("inquiries").update({status:v}).eq("id",id);if(error)status.textContent=error.message};
 function h(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
 boot();
}
</script></body></html>
