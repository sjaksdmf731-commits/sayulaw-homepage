<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAYUL | 관리자</title>
<link rel="icon" type="image/svg+xml" href="assets/sayul-mark.svg">
<style>
:root{--ink:#111319;--panel:#1a1d24;--panel2:#222630;--gold:#c6a469;--cream:#f4f1ea;--muted:#a7acb5;--line:rgba(255,255,255,.11);--danger:#d16e69;--green:#77bf99}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans KR",Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:268px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:33px 24px;background:var(--ink);color:#fff}.brand{font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.05em}.brand small{display:block;margin-top:7px;color:var(--gold);font:10px Arial,sans-serif;letter-spacing:.2em}.side-rule{height:1px;margin:34px 0;background:var(--line)}.side-label{margin:0 0 12px;color:#767d89;font-size:10px;font-weight:700;letter-spacing:.15em}.side-nav a{display:flex;align-items:center;gap:10px;padding:12px 0;color:#d1d5da;font-size:13px}.side-nav a::before{content:"";width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg)}.side-note{position:absolute;right:24px;bottom:30px;left:24px;color:#7f8691;font-size:11px;line-height:1.7}.page{padding:0 54px 60px}.topbar{min-height:110px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(17,19,25,.12)}.topbar h1{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-size:35px;font-weight:400;letter-spacing:-.04em}.topbar p{margin:7px 0 0;color:#777d87;font-size:13px}.top-actions{display:flex;align-items:center;gap:9px}.home-link{padding:11px 14px;border:1px solid #c9c6bf;color:#5c616a;font-size:12px}.home-link:hover{border-color:var(--gold);color:#8f6e35}.logout{padding:12px 17px;background:transparent!important;border:1px solid #b5b7ba!important;color:#31343a!important}.content{max-width:1240px;margin:0 auto}.status{margin:28px 0;padding:15px 18px;border-left:3px solid var(--gold);background:#fff;color:#525761;font-size:13px;line-height:1.55}.status.ok{border-color:var(--green)}.status.err{border-color:var(--danger)}.status.warn{border-color:#d4a64c}.hidden{display:none!important}.login-wrap{max-width:460px;margin:100px auto}.login-card,.panel{background:#fff;border:1px solid rgba(17,19,25,.09);box-shadow:0 8px 28px rgba(17,19,25,.04)}.login-card{padding:38px}.login-card h2,.panel h2{margin:0 0 8px;font-family:Georgia,"Noto Serif KR",serif;font-weight:400;letter-spacing:-.03em}.login-card p{margin:0 0 26px;color:#737983;font-size:13px}.dashboard-head{display:flex;justify-content:space-between;align-items:end;margin:42px 0 20px}.dashboard-head h2{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-size:27px;font-weight:400}.dashboard-head span{color:#838994;font-size:12px}.dashboard-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat-card{position:relative;min-height:122px;padding:22px 24px;overflow:hidden;background:var(--panel);color:#fff}.stat-card::after{content:"";position:absolute;right:-24px;bottom:-45px;width:120px;height:120px;border:1px solid rgba(198,164,105,.32);border-radius:50%}.stat-card span{display:block;color:#aeb3bb;font-size:11px;letter-spacing:.1em}.stat-card strong{display:block;margin-top:11px;color:#f3d69d;font:400 39px Georgia,serif}.stat-card em{display:block;margin-top:4px;color:#d5d8dc;font-size:11px;font-style:normal}.stat-card:nth-child(2){background:#252a33}.stat-card:nth-child(3){background:#faf9f5;color:var(--ink);border:1px solid #e3dfd6}.stat-card:nth-child(3) span{color:#747b84}.stat-card:nth-child(3) strong{color:#8f6e35}.stat-card:nth-child(3) em{color:#6d737a}.grid{display:grid;grid-template-columns:1fr;gap:20px}.panel{padding:29px}.panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}.panel-head .index{color:var(--gold);font:12px Georgia,serif;letter-spacing:.1em}label{display:block;color:#4c525d;font-size:12px;font-weight:700;letter-spacing:.02em}input,textarea,select{width:100%;margin:7px 0 16px;padding:14px;border:1px solid #dcdde0;border-radius:0;background:#fbfbfa;color:#20242b;font:14px "Noto Sans KR",Arial,sans-serif;transition:.2s}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,164,105,.12)}textarea{min-height:123px;resize:vertical}input[type=file]{padding:11px;background:#f8f7f3;font-size:12px}.check{display:flex;align-items:center;gap:9px;margin:1px 0 19px;color:#626873;font-weight:400}.check input{width:16px;height:16px;margin:0;accent-color:var(--gold)}button{padding:13px 18px;border:0;border-radius:0;background:var(--gold);color:#fff;font:700 13px "Noto Sans KR",Arial,sans-serif;cursor:pointer;transition:.2s}button:hover{filter:brightness(.92);transform:translateY(-1px)}.secondary{background:#343943}.danger{padding:8px 11px;background:transparent;color:var(--danger);border:1px solid rgba(209,110,105,.4);font-size:11px}.notice-templates{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 19px}.notice-templates button{padding:8px 10px;border:1px solid #ded6c6;background:#faf8f3;color:#65553b;font-size:11px}.list-panel{margin-top:20px;padding:0;overflow:hidden}.list-title{display:flex;justify-content:space-between;align-items:center;padding:25px 29px;border-bottom:1px solid #e5e4e0}.list-title h2{margin:0;font-size:22px}.list-title span{color:#888e96;font-size:12px}#inquiries,#cases,#notices{overflow:auto;padding:0 29px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:650px}th{padding:14px 9px;color:#8a9098;font-size:10px;letter-spacing:.08em;text-align:left;border-bottom:1px solid #e3e3df}td{padding:15px 9px;color:#424751;border-bottom:1px solid #ecebe8;vertical-align:middle;line-height:1.55}td img{display:block;border-radius:2px}.inquiry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px 0}.inquiry-card{padding:18px;border:1px solid #e4e2dc;background:#fcfcfa}.inquiry-card-head{display:flex;justify-content:space-between;gap:14px;align-items:start;margin-bottom:12px}.inquiry-card strong{font-size:15px}.inquiry-card .phone{display:block;margin-top:4px;color:#858b94;font-size:12px}.inquiry-card .inquiry-date{display:block;margin-top:5px;color:#a08a63;font-size:11px;font-variant-numeric:tabular-nums}.inquiry-card p{margin:0;padding:12px 0;border-top:1px solid #eceae5;color:#545a64;font-size:12px;line-height:1.75;white-space:pre-wrap}.inquiry-card select{min-width:100px;margin:0;padding:8px;font-size:11px}.empty{padding:25px 0;color:#878d96;font-size:13px}.admin-tabs{display:flex;gap:8px;margin:0 0 20px;border-bottom:1px solid #ddd9d0}.admin-tab{padding:12px 15px;background:transparent;color:#707680;font-size:12px}.admin-tab:hover{transform:none;filter:none}.admin-tab.is-active{position:relative;color:#8b6a31}.admin-tab.is-active::after{content:"";position:absolute;right:15px;bottom:-1px;left:15px;height:2px;background:var(--gold)}.admin-view{display:none!important}.admin-view.is-active{display:block!important}.grid{grid-template-columns:1fr}.inquiry-grid{grid-template-columns:1fr}.inquiry-card{padding:21px 22px}.inquiry-card-head{align-items:center;gap:18px;margin-bottom:17px}.inquiry-person{min-width:0;flex:1}.inquiry-card strong{display:block;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inquiry-card select{width:132px;min-width:132px;margin:0;padding:9px 10px;font-size:11px}.inquiry-message{padding-top:15px;border-top:1px solid #eceae5}.inquiry-message span{display:block;margin-bottom:6px;color:#9298a0;font-size:10px;font-weight:700;letter-spacing:.1em}.inquiry-card p{margin:0;padding:0;border:0;color:#454b55;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.embedded-list{margin:34px -29px -29px;border-top:1px solid #e5e4e0}.embedded-list .list-title{padding:24px 29px}.embedded-list #cases,.embedded-list #notices{padding:0 29px}.admin-tabs{display:flex;align-items:flex-end;gap:5px;margin:0 0 20px;padding:0;border-bottom:1px solid #d8d5ce;overflow-x:auto}.admin-tab{position:relative;flex:0 0 auto;padding:13px 19px 12px;border:1px solid #d8d5ce;border-bottom:0;border-radius:8px 8px 0 0;background:#e9e7e1;color:#717680;font:700 12px "Noto Sans KR",Arial,sans-serif;letter-spacing:.01em;box-shadow:none}.admin-tab::before{content:"";display:inline-block;width:7px;height:7px;margin:0 8px 1px 0;border:1px solid currentColor;transform:rotate(45deg)}.admin-tab:hover{background:#f5f3ee;color:#4a4e55;filter:none;transform:none}.admin-tab.is-active{z-index:1;margin-bottom:-1px;padding-top:11px;border-top:3px solid var(--gold);background:#fff;color:#1c2028}.admin-tab.is-active::after{display:none}@media(max-width:940px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:22px 24px}.side-rule,.side-nav,.side-note{display:none}.page{padding:0 24px 45px}.topbar{min-height:92px}.grid{grid-template-columns:1fr}.dashboard-stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.inquiry-grid{grid-template-columns:1fr}.dashboard-stats{grid-template-columns:1fr}.stat-card{min-height:92px}}@media(max-width:560px){.page{padding:0 16px 35px}.topbar h1{font-size:29px}.topbar p{display:none}.panel{padding:22px}.list-title{padding:21px}.dashboard-head{margin-top:30px}}
</style></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand">SAYUL<small>LAW OFFICE · CMS</small></div><div class="side-rule"></div><p class="side-note">SAYUL CMS<br>관리자 전용 시스템</p></aside>
<main class="page"><header class="topbar"><div><h1>관리자 대시보드</h1><p>사율 홈페이지의 콘텐츠와 상담 신청을 관리합니다.</p></div><div class="top-actions"><a class="home-link" href="index.html">홈페이지 보기 ↗</a><button id="logout" class="logout hidden">로그아웃</button></div></header><div class="content">
<div id="status" class="status">Supabase 연결 확인 중…</div>
<section id="loginPanel" class="login-wrap hidden"><div class="login-card"><h2>관리자 로그인</h2><p>등록된 관리자 계정으로 로그인해 주세요.</p><label>이메일<input id="email" type="email" placeholder="관리자 이메일"></label><label>비밀번호<input id="password" type="password" placeholder="비밀번호"></label><button id="login">안전하게 로그인</button></div></section>
<section id="cms" class="hidden">
<div class="dashboard-head"><div><div class="side-label">CONTENT MANAGEMENT</div><h2>홈페이지 관리</h2></div><span>선택한 항목만 표시됩니다.</span></div>
<div class="admin-tabs" role="tablist" aria-label="관리 메뉴"><button type="button" class="admin-tab is-active" data-view="case">사건사례 관리</button><button type="button" class="admin-tab" data-view="notice">공지사항 관리</button><button type="button" class="admin-tab" data-view="inquiry">상담신청 관리</button></div>
<section id="caseView" class="panel admin-view case-view is-active"><div class="panel-head"><h2>사건사례 관리</h2><span class="index">CASE</span></div><label>사건 분야<select id="caseCategory"><option value="" selected disabled>사건 분야를 선택하세요</option><optgroup label="민사"><option>민사 · 계약분쟁</option><option>민사 · 채권회수</option><option>민사 · 손해배상</option><option>민사 · 부동산/임대차</option><option>민사 · 집합건물/관리비</option></optgroup><optgroup label="가사"><option>가사 · 이혼</option><option>가사 · 재산분할/위자료</option><option>가사 · 양육권/양육비</option><option>가사 · 상간 손해배상</option><option>가사 · 상속</option></optgroup><optgroup label="기업·기타"><option>기업 · 계약서/법률자문</option><option>기업 · 상사분쟁</option><option>기타</option></optgroup></select></label><label>제목<input id="caseTitle" placeholder="사건사례 제목"></label><label>사건 개요<textarea id="caseSummary" placeholder="사건의 핵심 내용과 대응 방향"></textarea></label><label>결과<input id="caseResult" placeholder="예: 합의 성립, 청구 기각"></label><label>사건 이미지 · JPG / PNG / BMP (최대 5MB)<input id="caseImage" type="file" accept=".jpg,.jpeg,.png,.bmp,image/jpeg,image/png,image/bmp"></label><label class="check"><input id="casePublished" type="checkbox" checked> 홈페이지에 바로 공개</label><button id="addCase">사건사례 등록</button><div class="embedded-list"><div class="list-title"><h2>등록된 사건사례</h2><span>공개 여부와 이미지를 확인하세요.</span></div><div id="cases"></div></div></section>
<section id="noticeView" class="panel admin-view notice-view"><div class="panel-head"><h2>공지사항 관리</h2><span class="index">NOTICE</span></div><div id="noticeTemplates" class="notice-templates"><button type="button" data-title="법률상담 안내" data-content="법률상담 진행 절차와 예약 방법을 안내드립니다. 상담을 원하시는 경우 홈페이지 상담신청을 통해 내용을 남겨주세요.">상담 안내</button><button type="button" data-title="업무 안내" data-content="법률사무소 SAYUL의 주요 업무 분야와 상담 방향을 안내드립니다. 개별 사안에 따라 검토 범위와 절차가 달라질 수 있습니다.">업무 안내</button><button type="button" data-title="공지사항" data-content="홈페이지 공지사항을 입력해 주세요.">기본 공지</button></div><label>제목<input id="noticeTitle" placeholder="공지 제목"></label><label>내용<textarea id="noticeContent" placeholder="공지 내용을 입력하세요"></textarea></label><label class="check"><input id="noticePublished" type="checkbox" checked> 홈페이지에 바로 공개</label><button id="addNotice">공지사항 등록</button><div class="embedded-list"><div class="list-title"><h2>등록된 공지사항</h2><span>홈페이지 공지 목록</span></div><div id="notices"></div></div></section>
<section id="inquiryList" class="panel admin-view inquiry-view"><div class="list-title"><h2>상담신청 관리</h2><span>문의 목록 및 처리 상태</span></div><div id="inquiries"></div></section>
</section></div></main></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import {getConfig} from "./js/config.js";
const cfg=getConfig(), status=document.getElementById("status"), loginPanel=document.getElementById("loginPanel"), cms=document.getElementById("cms"), logout=document.getElementById("logout");
if(!cfg.url||!cfg.key){status.className="status warn";status.textContent="js/config.js에 Supabase Project URL과 Publishable key를 입력하세요.";loginPanel.classList.remove("hidden");}
else{
 const sb=createClient(cfg.url,cfg.key);
 async function boot(){
   const {data:{session}}=await sb.auth.getSession();
   if(!session){loginPanel.classList.remove("hidden");status.textContent="관리자 로그인이 필요합니다.";return;}
   const {data:p,error}=await sb.from("profiles").select("is_admin,display_name").eq("id",session.user.id).single();
   if(error||!p?.is_admin){status.className="status err";status.textContent="관리자 권한이 없는 계정입니다.";return;}
   status.className="status ok";status.textContent=`관리자 인증 성공 · ${p.display_name||session.user.email}`;
   loginPanel.classList.add("hidden");cms.classList.remove("hidden");logout.classList.remove("hidden");loadAll();
 }
 document.getElementById("login").onclick=async()=>{
   status.className="status";status.textContent="로그인 중…";
   const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
   if(error){status.className="status err";status.textContent="로그인 실패: "+error.message;return;} boot();
 };
 logout.onclick=async()=>{await sb.auth.signOut();location.reload()};

 async function uploadCaseImage(){
   const file=document.getElementById("caseImage").files[0];
   if(!file)return null;
   const allowed=["image/jpeg","image/png","image/bmp"];
   if(!allowed.includes(file.type)||file.size>5*1024*1024)throw new Error("JPG, PNG, BMP 파일만 5MB 이하로 올릴 수 있습니다.");
   const extension=file.name.split(".").pop().toLowerCase();
   const path="cases/"+crypto.randomUUID()+"."+extension;
   const {error}=await sb.storage.from("case-images").upload(path,file,{cacheControl:"31536000",upsert:false,contentType:file.type});
   if(error)throw error;
   const {data}=sb.storage.from("case-images").getPublicUrl(path);
   return data.publicUrl;
 }
 document.getElementById("addCase").onclick=async()=>{
   try{
     status.className="status";status.textContent="사건사례와 이미지를 저장하는 중…";
     const image_url=await uploadCaseImage();
     const {error}=await sb.from("cases").insert({category:caseCategory.value.trim(),title:caseTitle.value.trim(),summary:caseSummary.value.trim(),result:caseResult.value.trim(),image_url,published:casePublished.checked});
     if(error)throw error;
     status.className="status ok";status.textContent="사건사례 등록 성공";caseCategory.value=caseTitle.value=caseSummary.value=caseResult.value="";document.getElementById("caseImage").value="";loadCases();
   }catch(error){status.className="status err";status.textContent="사건사례 등록 실패: "+error.message;}
 };
 document.getElementById("addNotice").onclick=async()=>{
   const {error}=await sb.from("notices").insert({title:noticeTitle.value.trim(),content:noticeContent.value.trim(),published:noticePublished.checked});
   status.className=error?"status err":"status ok";status.textContent=error?"공지 등록 실패: "+error.message:"공지 등록 성공";if(!error){noticeTitle.value=noticeContent.value="";loadNotices();}
 };
 async function loadAll(){loadCases();loadNotices();loadInquiries();}
 async function loadDashboardStats(){
   const [inquiryResult,caseResult,noticeResult]=await Promise.all([
     sb.from("inquiries").select("id",{count:"exact",head:true}).eq("status","new"),
     sb.from("cases").select("id",{count:"exact",head:true}).eq("published",true),
     sb.from("notices").select("id",{count:"exact",head:true}).eq("published",true)
   ]);
   document.getElementById("statNewInquiries").textContent=inquiryResult.error?"—":(inquiryResult.count??0);
   document.getElementById("statPublishedCases").textContent=caseResult.error?"—":(caseResult.count??0);
   document.getElementById("statPublishedNotices").textContent=noticeResult.error?"—":(noticeResult.count??0);
 }
 async function loadCases(){const {data,error}=await sb.from("cases").select("*").order("created_at",{ascending:false});cases.innerHTML=error?error.message:(data?.length?`<table><tr><th>분야</th><th>제목</th><th>이미지</th><th>공개</th><th>작업</th></tr>${data.map(x=>`<tr><td>${h(x.category)}</td><td>${h(x.title)}</td><td>${x.image_url?'<img src="'+h(x.image_url)+'" alt="" style="width:72px;height:48px;object-fit:cover">':"없음"}</td><td>${x.published?"공개":"비공개"}</td><td><button class="danger" onclick="deleteCase('${x.id}')">삭제</button></td></tr>`).join("")}</table>`:"등록된 사건사례 없음");}
 async function loadNotices(){const {data,error}=await sb.from("notices").select("*").order("created_at",{ascending:false});notices.innerHTML=error?error.message:(data?.length?`<table><tr><th>제목</th><th>공개</th><th>작업</th></tr>${data.map(x=>`<tr><td>${h(x.title)}</td><td>${x.published?"공개":"비공개"}</td><td><button class="danger" onclick="deleteNotice('${x.id}')">삭제</button></td></tr>`).join("")}</table>`:"등록된 공지 없음");}
 async function loadInquiries(){const {data,error}=await sb.from("inquiries").select("*").order("created_at",{ascending:false});inquiries.innerHTML=error?error.message:(data?.length?`<div class="inquiry-grid">${data.map(x=>`<article class="inquiry-card"><div class="inquiry-card-head"><div class="inquiry-person"><strong>${h(x.name)}</strong><span class="phone">${h(x.phone)}</span><span class="inquiry-date">접수 · ${formatKoreanDate(x.created_at)}</span></div><select aria-label="상담 상태" onchange="setStatus('${x.id}',this.value)"><option ${x.status==="new"?"selected":""} value="new">신규 접수</option><option ${x.status==="contacted"?"selected":""} value="contacted">연락 완료</option><option ${x.status==="done"?"selected":""} value="done">처리 완료</option></select></div><div class="inquiry-message"><span>상담 내용</span><p>${h(x.message)}</p></div></article>`).join("")}</div>`:'<div class="empty">아직 접수된 상담신청이 없습니다.</div>');}
 window.deleteCase=async id=>{const {error}=await sb.from("cases").delete().eq("id",id);if(error)status.textContent=error.message;else loadCases()};
 window.deleteNotice=async id=>{const {error}=await sb.from("notices").delete().eq("id",id);if(error)status.textContent=error.message;else loadNotices()};
 window.setStatus=async(id,v)=>{const {error}=await sb.from("inquiries").update({status:v}).eq("id",id);if(error)status.textContent=error.message};
 function formatKoreanDate(value){if(!value)return "일시 없음";const date=new Date(value);if(Number.isNaN(date.getTime()))return "일시 없음";const parts=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(date).reduce((out,part)=>(out[part.type]=part.value,out),{});return `${parts.year}.${parts.month}.${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;}\n function h(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
 const activateView=view=>{const tab=document.querySelector(`.admin-tab[data-view="${view}"]`);if(!tab)return;document.querySelectorAll(".admin-tab").forEach(x=>x.classList.toggle("is-active",x===tab));document.querySelectorAll(".admin-view").forEach(x=>x.classList.toggle("is-active",x.classList.contains(view+"-view")));};document.querySelectorAll(".admin-tab").forEach(button=>button.addEventListener("click",()=>activateView(button.dataset.view)));document.querySelectorAll(".side-nav a[data-view]").forEach(link=>link.addEventListener("click",event=>{event.preventDefault();activateView(link.dataset.view);history.replaceState(null,"","#"+link.dataset.view)}));
 document.getElementById("noticeTemplates").addEventListener("click",event=>{const button=event.target.closest("button[data-title]");if(!button)return;noticeTitle.value=button.dataset.title;noticeContent.value=button.dataset.content;});
 boot();
}
